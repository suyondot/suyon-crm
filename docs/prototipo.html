<title>Suyon CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — nav rail (marca + selector de tienda) | área de trabajo. Chats = lista | conversación | ficha. Celular = pestañas abajo, un panel a la vez. */
:root{
  --bg:#F4F2F3; --surface:#FFFFFF; --surface-2:#EEEAEC; --line:#E1DADE; --fg:#1F1A1D; --muted:#6D6469;
  --accent:#7A1F35; --accent-fg:#FFFFFF; --accent-soft:#F4E4E9; --mine:#F7EDF0;
  --ok:#1E7A4C; --ok-soft:#E3F3EA; --warn:#A35F00; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE6E3; --info:#2D5BA8; --info-soft:#E4ECF8;
  --t-yellow:#E8B530; --t-orange:#E9773E; --t-green:#2E9E5E; --t-blue:#4A74D9; --t-wine:#7A1F35; --t-grey:#8A8186;
  --scrim:rgba(20,8,14,.45); --shadow:0 12px 32px rgba(40,10,20,.14);
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141113; --surface:#1C181A; --surface-2:#262124; --line:#352E32; --fg:#EFE9EC; --muted:#A79DA2;
  --accent:#E07A93; --accent-fg:#1A0E12; --accent-soft:#3A1F28; --mine:#2E1C23;
  --ok:#5CC98D; --ok-soft:#173326; --warn:#E9A94A; --warn-soft:#3A2A12; --bad:#F07A6E; --bad-soft:#3D1C19; --info:#86A9EE; --info-soft:#1C2A42;
  --t-wine:#E07A93; --t-grey:#9A9196; --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141113; --surface:#1C181A; --surface-2:#262124; --line:#352E32; --fg:#EFE9EC; --muted:#A79DA2;
  --accent:#E07A93; --accent-fg:#1A0E12; --accent-soft:#3A1F28; --mine:#2E1C23;
  --ok:#5CC98D; --ok-soft:#173326; --warn:#E9A94A; --warn-soft:#3A2A12; --bad:#F07A6E; --bad-soft:#3D1C19; --info:#86A9EE; --info-soft:#1C2A42;
  --t-wine:#E07A93; --t-grey:#9A9196; --scrim:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark }

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.brand:hover{background:var(--surface-2)}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;flex:none}
.brand .bt{min-width:0;flex:1}
.brand b{display:block;font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caret{color:var(--muted);font-size:12px}
.navbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:600;text-align:left;width:100%}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn:hover{background:var(--surface-2);color:var(--fg)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navbtn .cnt{margin-left:auto;background:var(--accent);color:var(--accent-fg);border-radius:10px;font-size:11px;padding:0 6px;font-family:var(--f-mono)}
.side-foot{margin-top:auto;padding:10px 8px;color:var(--muted);font-size:12px}

.main{min-width:0;display:flex;flex-direction:column;height:100%;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px 12px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.topbar h1{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.topbar .grow{flex:1}
.store-top{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-weight:600;font-size:13px;max-width:100%;min-width:0}
.store-top span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-demo{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:20px;white-space:nowrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.content{flex:1;min-height:0;overflow:auto;position:relative}
.page{padding:20px 24px 40px;max-width:1180px}

/* selector de tienda */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.storepanel{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));width:min(330px,calc(100% - 32px));background:var(--surface);border-radius:14px;box-shadow:var(--shadow);z-index:31;padding:10px;display:grid;gap:4px;max-height:calc(100% - 28px);overflow:auto}
.storepanel h4{margin:8px 8px 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.storeopt{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:none;border-radius:9px;padding:8px;text-align:left;width:100%}
.storeopt:hover{background:var(--surface-2)}
.storeopt[aria-current="true"]{background:var(--accent-soft)}
.storeopt .sm{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.storeopt b{display:block;font-size:13.5px}
.storeopt span{display:block;font-size:12px;color:var(--muted)}
.storeopt .st{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.st-on{background:var(--ok-soft);color:var(--ok)} .st-off{background:var(--surface-2);color:var(--muted)}
.addstore{border:1px dashed var(--line);background:none;border-radius:9px;padding:9px;font-weight:600;color:var(--muted);margin-top:6px}

/* chats */
.chats{display:grid;grid-template-columns:330px minmax(0,1fr) 310px;height:100%;position:relative}
.chats.no-ficha{grid-template-columns:330px minmax(0,1fr)}
.chats.no-ficha .ficha{display:none}
.list{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.list-head{padding:12px;display:grid;gap:10px;border-bottom:1px solid var(--line);position:relative}
.searchrow{display:flex;gap:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:8px;padding:7px 10px;flex:1;min-width:0}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.filterbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.filterbtn[aria-expanded="true"],.filterbtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tagmenu{position:absolute;left:12px;right:12px;top:52px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:8;padding:6px;display:grid;gap:2px;max-height:340px;overflow:auto}
.tagmenu button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:7px 8px;border-radius:7px;text-align:left}
.tagmenu button:hover{background:var(--surface-2)}
.tagmenu .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.activef{display:flex;gap:6px;flex-wrap:wrap}
.activef button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3px 10px;font-weight:700;font-size:12px}
.callstrip{display:flex;align-items:center;gap:10px;width:100%;border:0;border-radius:10px;padding:9px 11px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13px;text-align:left}
.callstrip svg{width:18px;height:18px;flex:none}
.callstrip b{font-family:var(--f-mono)}
.callstrip .go{margin-left:auto;white-space:nowrap}
.callstrip.on{background:var(--fg);color:var(--bg)}
.callrow{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.callrow .top{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center}
.callrow .top b{display:block}
.callrow .top span{font-size:12.5px;color:var(--muted)}
.callrow .tel{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:13px}
.callrow .res{display:flex;gap:6px;flex-wrap:wrap}
.callrow .res button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:12.5px;font-weight:600}
.callrow .res .win{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.callrow .log{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.8}
.items{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item:hover{background:var(--surface-2)}
.item[aria-current="true"]{background:var(--accent-soft)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .lm{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11.5px;color:var(--muted)}
.item .row{display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap}
.unread{background:var(--accent);color:var(--accent-fg);border-radius:10px;font-size:11px;padding:0 6px;font-family:var(--f-mono);font-weight:500}
.who{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.who.asesora{background:var(--bad-soft);color:var(--bad)}
.who.ia{background:var(--info-soft);color:var(--info)}
.who.bot,.who.cerrado{background:var(--surface-2);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 6px;border-radius:5px;background:var(--surface-2);white-space:nowrap}
.tag i{width:8px;height:8px;border-radius:2px;display:inline-block}
.tag.sys{outline:1px dashed var(--muted);outline-offset:-1px}
.empty{display:grid;place-items:center;text-align:center;gap:6px;padding:40px 20px;color:var(--muted)}
.empty b{color:var(--fg);font-size:15px}

.conv{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.conv-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.conv-head .t{min-width:0}
.conv-head .t b{display:block;font-size:15px}
.conv-head .t span{font-size:12px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
.back{display:none}
.window{font-size:12px;color:var(--ok);background:var(--ok-soft);padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.window.off{color:var(--muted);background:var(--surface-2)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
.banner.ia{background:var(--info-soft);color:var(--info)}
.banner .grow{flex:1;min-width:180px}
.banner button{border:0;border-radius:7px;padding:6px 12px;font-weight:700;font-size:12.5px}
.btn-solid{background:var(--accent);color:var(--accent-fg);border:0}
.btn-ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)!important}
.msgs{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,520px);display:flex;flex-direction:column;gap:3px}
.m.out{align-self:flex-end;align-items:flex-end}
.m .by{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.m .by.ia{color:var(--info)} .m .by.ase{color:var(--ok)}
.bub{background:var(--surface);border:1px solid var(--line);padding:8px 11px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.out .bub{background:var(--mine);border-color:transparent}
.bub small{display:block;text-align:right;color:var(--muted);font-size:10.5px;margin-top:3px;font-family:var(--f-mono)}
.media{display:flex;align-items:center;gap:10px;padding:10px 12px;min-width:200px;border-radius:12px;background:var(--surface-2);font-weight:600;font-size:13px;color:var(--muted)}
.media svg{width:22px;height:22px;flex:none}
.photo{border-radius:12px;overflow:hidden;max-width:260px;border:1px solid var(--line);background:var(--surface)}
.photo img,.photo video{display:block;width:100%;max-height:300px;object-fit:cover}
.m audio{max-width:260px}
.form{font-family:var(--f-mono);font-size:12.5px;line-height:1.55}
.sysm{align-self:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 12px;margin:6px 0;text-align:center;max-width:92%}
.closed{padding:8px 14px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600;border-top:1px solid var(--line)}
.composer{border-top:1px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;gap:6px;align-items:flex-end;position:relative}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);min-height:40px;max-height:120px;outline:none}
.composer textarea:focus{border-color:var(--accent)}
.composer .iconbtn{height:40px;min-width:40px;padding:0 9px}
.send{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:9px 14px;font-weight:700;height:40px}
.qrmenu{position:absolute;left:12px;right:12px;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:300px;overflow:auto;z-index:5}
.qrmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-bottom:1px solid var(--line)}
.qrmenu button:hover{background:var(--surface-2)}
.qrmenu b{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.qrmenu span{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ficha{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:16px;display:grid;gap:18px;align-content:start}
.sec h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec h3 button{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:0;text-transform:none;padding:0}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:5px 10px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.steps span{font-size:11.5px;padding:3px 8px;border-radius:5px;background:var(--surface-2);color:var(--muted);font-weight:600}
.steps span.done{background:var(--ok-soft);color:var(--ok)}
.steps span.now{background:var(--accent);color:var(--accent-fg)}
.tagbox{display:flex;flex-wrap:wrap;gap:6px}
.tagbox button{border:0;cursor:pointer;background:none;padding:0}
.tagbox .off{opacity:.42}
.wide{width:100%;padding:10px;border-radius:10px;font-weight:700;display:flex;justify-content:center;gap:6px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.note{font-size:12.5px;color:var(--muted)}
.cost{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.ordbadge{display:flex;justify-content:space-between;align-items:center;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;margin-top:12px}
.edit{display:grid;gap:8px}
.edit .field input,.edit .field select{padding:6px 8px}
.irow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) 30px;gap:6px;align-items:center}
.irow select{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg);min-width:0}
.irow button{border:0;background:var(--surface-2);border-radius:7px;height:30px}

/* pages */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h2{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.ph .grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .s b{color:var(--ok)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.card h3{margin:0 0 4px;font-size:15px}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.funnel{display:grid;gap:8px}
.fr{display:grid;grid-template-columns:130px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.fr .bar{height:22px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.fr .bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.fr .val{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.fr .val em{font-style:normal;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}

function orderText(o){
  const p=PROD[o.store],n=o.items.length,tot=omonto(o);
  const tallas=o.items.map(i=>i[0]).join(', '),colores=o.items.map(i=>i[1]).join(', ');

}
function copyOrder(o){
  const txt=orderText(o);

}

function cNum(){const st=store();return `<div class="ph"><div><h2>Número de WhatsApp</h2><p>Este número es la tienda. Para agregar otro, usa el selector de tiendas.</p></div></div>
  <div class="card" style="margin-bottom:14px"><h3>${st.n}</h3><p class="sub mono">${st.phone}</p><dl class="kv"><dt>Nombre visible</dt><dd>${st.brand}</dd><dt>Conexión</dt><dd>${S.store==='pf'?'Hoy en Botcake · pasa a la API oficial':'Por conectar a la API oficial'}</dd><dt>Ventana gratis</dt><dd>72 h por anuncio</dd><dt>Costo por número</dt><dd>US$0</dd></dl></div>
  <div class="card"><div style="display:flex;gap:12px;align-items:flex-start"><div style="flex:1;min-width:0"><h3>También en la app WhatsApp Business del celular</h3><p class="sub" style="margin:0">Coexistencia oficial de Meta: el mismo número funciona en el CRM y en el celular. Lo que envías desde la app (por ejemplo, las guías) no tiene costo y aparece aquí en el chat.</p></div><button class="toggle" data-toggle aria-pressed="true" aria-label="Usar también en la app del celular"></button></div></div>`}
function cInt(){
  const it=[['Google Sheets · Shalom','Conectado','st-on','Cada pedido de provincia agrega una fila a tu hoja de Shalom: nombre, DNI, celular, sede, prendas, monto, adelanto y saldo. Tú solo completas la guía.'],
   ['Meta · Conversiones (CAPI)','Conectado','st-on','Manda «Compra» a Meta al crear el pedido, con el anuncio de origen.'],
   ['Meta Ads · gasto por anuncio','Por conectar','st-off','Jala el gasto de cada anuncio para calcular el CPA real sin escribirlo a mano.'],
   ['Shalom · guías','Si Shalom da acceso','st-off','Bajar las guías y enviarlas a todas las clientas de una sola vez.']];
  return `<div class="ph"><div><h2>Integraciones</h2><p>Otras herramientas conectadas a esta tienda.</p></div></div>
  <div class="grid">${it.map(i=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h3 style="margin:0">${i[0]}</h3><span class="st ${i[2]}" style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px">${i[1]}</span></div><p class="note" style="margin:6px 0 0">${i[3]}</p></div>`).join('')}</div>`}

/* ---------- EVENTOS ---------- */
let pendingFile=null;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-nav],[data-role],[data-filter],[data-open],[data-act],[data-tag],[data-tagf],[data-qr],[data-otab],[data-ostate],[data-ctab],[data-toggle],[data-toast],[data-store],[data-etipo],[data-erm],[data-orm],[data-copyo],[data-edito],[data-callr],[data-copytel]');
  if(!t) return;
  const d=t.dataset;
  if(d.copytel){try{navigator.clipboard.writeText(d.copytel).then(()=>toast('Celular copiado'),()=>toast(d.copytel))}catch(err){toast(d.copytel)}return}
  if(d.callr){
    const [id,r]=d.callr.split('|'),c=chats.find(x=>x.id===+id),now=new Date().toTimeString().slice(0,5);
    c.calls=c.calls||[];c.calls.push({r,t:'hoy '+now});
    c.msgs.push({w:'sys',x:`Llamada de ${me()}: ${r}`});
    if(r==='Cerró'){c.tags=c.tags.filter(x=>x!=='YAPE PENDIENTE'&&x!=='LIMA PENDIENTE');if(!c.tags.includes('COMPRÓ'))c.tags.push('COMPRÓ');if(!c.tags.includes('ASESOR'))c.tags.push('ASESOR');c.h='asesora';c.why='Cerró por llamada: crear pedido';toast(c.n+' cerró. Crea su pedido desde el chat.')}
    else toast(`${c.n}: ${r}`);
    render();return}
  if(d.nav){S.view=d.nav;S.qr=false;S.edit=null;render();return}
  if(d.role){S.role=d.role;render();return}
  if(d.store){S.store=d.store;S.storeMenu=false;S.open=null;S.callMode=false;S.edit=null;S.tagf=[];if(window.innerWidth>860){const f=storeChats().find(c=>c.h==='asesora');S.open=f?f.id:null}render();toast('Ahora estás en '+store().brand+' · '+store().n);return}
  if(d.filter){S.filter=d.filter;render();return}
  if(d.tagf){const i=S.tagf.indexOf(d.tagf);i>=0?S.tagf.splice(i,1):S.tagf.push(d.tagf);render();return}
  if(d.open){S.open=+d.open;S.qr=false;S.draft='';S.edit=null;S.tagMenu=false;const c=chats.find(x=>x.id===S.open);c.un=0;if(window.innerWidth<=1180)S.ficha=false;render();return}
  if(d.tag){const c=chats.find(x=>x.id===S.open);const i=c.tags.indexOf(d.tag);i>=0?c.tags.splice(i,1):c.tags.push(d.tag);render();return}
  if(d.qr!==undefined){S.draft=QR[S.store][+d.qr][1];S.qr=false;render();const ta=$('#draft');ta&&ta.focus();return}
  if(d.otab){S.otab=d.otab;S.ostate='Todos';render();return}
  if(d.ostate){S.ostate=d.ostate;render();return}
  if(d.ctab){S.ctab=d.ctab;render();return}
  if(d.toggle!==undefined){t.setAttribute('aria-pressed',t.getAttribute('aria-pressed')!=='true');return}
  if(d.toast){toast(d.toast);return}
  if(d.etipo){S.edit.tipo=d.etipo;render();return}
  if(d.erm!==undefined){S.edit.items.splice(+d.erm,1);render();return}
  if(d.orm!==undefined){S.oedit.items.splice(+d.orm,1);drawOrderModal();return}
  if(d.copyo){copyOrder(orders.find(o=>o.id===+d.copyo));return}
  if(d.edito){openOrderEdit(orders.find(o=>o.id===+d.edito));return}
  const c=chats.find(x=>x.id===S.open);
  switch(d.act){
    case 'stores':S.storeMenu=true;drawStoreMenu();break;
    case 'closestores':S.storeMenu=false;drawStoreMenu();break;
    case 'tagmenu':S.tagMenu=!S.tagMenu;render();break;
    case 'calls':S.callMode=!S.callMode;S.tagMenu=false;render();break;
    case 'back':S.open=null;render();break;
    case 'ficha':S.ficha=!S.ficha;render();break;
    case 'qr':S.qr=!S.qr;render();break;
    case 'attach':$('#fileup').click();break;
    case 'assetup':$('#assetup').click();break;
    case 'mic':toast('Grabar audio se activa en la versión conectada. Por ahora puedes adjuntar un audio con el clip.');break;
    case 'take':c.h='asesora';c.why=c.why||'Tomado por '+me();c.msgs.push({w:'sys',x:me()+' tomó el chat · la IA queda en pausa'});render();toast('Chat asignado a ti. La IA está en pausa.');break;
    case 'toia':c.h='ia';c.tags=c.tags.filter(x=>x!=='ASESOR');c.why='';c.msgs.push({w:'sys',x:'Devuelto a la IA'});render();toast('La IA retoma el chat.');break;
    case 'send':{const v=($('#draft')||{}).value||'';if(!v.trim())return;if(!c.win){toast('Ventana cerrada: elige una plantilla aprobada.');return}c.msgs.push({w:'ase',by:me(),x:v.trim(),t:new Date().toTimeString().slice(0,5)});S.draft='';S.qr=false;render();break}
    case 'edit':{
      const o=c.order?orders.find(x=>x.id===c.order):null;
      S.edit={tipo:c.f.tipo||'Lima',nombre:c.f.nombre,cel:c.f.cel,dni:c.f.dni,dir:c.f.dir,items:c.f.items.map(i=>[...i])};
      if(!S.ficha)S.ficha=true;render();break}
    case 'ecancel':S.edit=null;render();break;
    case 'eadd':S.edit.items.push([PROD[c.store].sizes[1],'Negro']);render();break;
    case 'esave':{
      if(!S.edit.items.length){toast('Agrega al menos una prenda.');return}
      Object.assign(c.f,{tipo:S.edit.tipo,nombre:S.edit.nombre,cel:S.edit.cel,dni:S.edit.dni,dir:S.edit.dir,items:S.edit.items});
      let msg='Pedido en curso actualizado';
      if(c.order){const o=orders.find(x=>x.id===c.order);Object.assign(o,{tipo:c.f.tipo,cli:c.f.nombre,cel:c.f.cel,dni:c.f.dni,dest:c.f.dir,items:c.f.items.map(i=>[...i])});if(!ST[o.tipo].includes(o.estado))o.estado=ST[o.tipo][0];msg=`Pedido #${o.id} actualizado`}
      c.msgs.push({w:'sys',x:me()+' editó el pedido: '+c.f.items.map(i=>i[1]+' '+i[0]).join(', ')});
      S.edit=null;render();toast(msg);break}
    case 'create':{
      const id=nextOrder++;
      orders.unshift({id,store:c.store,tipo:c.f.tipo||'Lima',cli:c.f.nombre||c.n,cel:c.f.cel,dni:c.f.dni,items:c.f.items.map(i=>[...i]),estado:(c.f.tipo==='Provincia'?'Yape por validar':'Nuevo'),dest:c.f.dir||'—',guia:'',ad:c.ad,chat:c.id});
      c.order=id;if(!c.tags.includes('COMPRÓ'))c.tags.push('COMPRÓ');
      c.msgs.push({w:'sys',x:`Pedido #${id} creado · ${soles(price(c.store,c.f.items.length))} · Compra enviada a Meta`});
      render();toast(`Pedido #${id} creado${c.f.tipo==='Provincia'?' y agregado a tu Sheet de Shalom':''}. Ya puedes copiar la orden.`);break}
    case 'copy':copyOrder(orders.find(o=>o.id===c.order));break;
    case 'oadd':{const o=orders.find(x=>x.id===S.oedit.id);S.oedit.items.push([PROD[o.store].sizes[1],'Negro']);drawOrderModal();break}
    case 'osave':{
      const E=S.oedit;if(!E.items.length){toast('Agrega al menos una prenda.');return}
      const o=orders.find(x=>x.id===E.id);Object.assign(o,{cli:E.cli,cel:E.cel,dni:E.dni,dest:E.dest,items:E.items});
      const ch=chats.find(x=>x.order===o.id);if(ch)Object.assign(ch.f,{nombre:E.cli,cel:E.cel,dni:E.dni,dir:E.dest,items:E.items.map(i=>[...i])});
      S.oedit=null;drawOrderModal();render();toast(`Pedido #${o.id} actualizado`);break}
    case 'closem':if(e.target===t){S.oedit=null;$('#layer').innerHTML=''}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){S.q=t.value;const pos=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);return}
  if(t.id==='draft'){const was=S.qr;S.draft=t.value;const want=t.value.startsWith('/');if(want||want!==was){S.qr=want;const pos=t.selectionStart;render();const n=$('#draft');n.focus();n.setSelectionRange(pos,pos)}return}
  if(t.dataset.e&&S.edit){S.edit[t.dataset.e]=t.value;return}
  if(t.dataset.o&&S.oedit){S.oedit[t.dataset.o]=t.value;return}
  if(t.dataset.stock){const [s,c]=t.dataset.stock.split('|');STOCK[S.store][s][c]=Math.max(0,+t.value||0);t.parentElement.classList.toggle('low',STOCK[S.store][s][c]<=5);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ord){const o=orders.find(x=>x.id===+t.dataset.ord);o.estado=t.value;render();toast(`Pedido #${o.id}: ${o.estado}`);return}
  if(t.dataset.ei&&S.edit){const [i,k]=t.dataset.ei.split('|');S.edit.items[+i][+k]=t.value;return}
  if(t.dataset.oi&&S.oedit){const [i,k]=t.dataset.oi.split('|');S.oedit.items[+i][+k]=t.value;return}
  if(t.dataset.stock){render();return}
  if(t.id==='fileup'&&t.files[0]){
    const f=t.files[0],c=chats.find(x=>x.id===S.open);t.value='';if(!c)return;
    if(!c.win){toast('Ventana cerrada: solo plantillas.');return}
    const k=f.type.startsWith('image')?'img':f.type.startsWith('video')?'video':f.type.startsWith('audio')?'audio':null;
    if(!k){toast('Solo fotos, videos o audios.');return}
    const r=new FileReader();r.onload=()=>{c.msgs.push({w:'ase',by:me(),k,x:f.name,src:r.result,t:new Date().toTimeString().slice(0,5)});render();toast((k==='img'?'Foto':k==='video'?'Video':'Audio')+' enviado')};r.readAsDataURL(f);return}
  if(t.id==='assetup'&&t.files[0]){
    const f=t.files[0];t.value='';const k=f.type.startsWith('video')?'video':'img';
    const add=src=>{ASSETS[S.store].push({k,n:f.name.replace(/\.[^.]+$/,''),key:f.name.replace(/\.[^.]+$/,'').toUpperCase(),when:'Define cuándo se envía',src});render();toast('Archivo agregado al prompt')};
    if(k==='img'){const r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(f)}else add(null);return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.storeMenu){S.storeMenu=false;drawStoreMenu()}else if(S.oedit){S.oedit=null;$('#layer').innerHTML=''}else if(S.tagMenu){S.tagMenu=false;render()}else if(S.qr){S.qr=false;render()}}
  if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='draft'){e.preventDefault();const b=document.querySelector('[data-act="send"]');b&&b.click()}
});
render();
</script>
